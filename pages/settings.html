<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> 설정 | 루이의 음악실 </title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pages.css">
</head>

<body>

    <header class="site-header">

        <div class="logo">

            <span class="logo-icon"> 🎹 </span>

            <div>
                <h1> 루이의 음악실 </h1>
                <p> Louis Kariel Music Blog </p>
            </div>

        </div>

        <nav class="main-nav">

            <a href="../index.html">
                홈
            </a>

            <a href="piano.html">
                피아노
            </a>

            <a href="composer.html">
                작곡실
            </a>

            <a href="board.html">
                게시판
            </a>

            <a href="profile.html">
                프로필
            </a>

        </nav>

    </header>

    <main class="settings-page">

        <section class="settings-header">

            <p> SETTINGS </p>

            <h2>
                ⚙️ 설정
            </h2>

            <span>
                음악실 환경을 설정합니다.
            </span>

        </section>

        <section class="settings-list">

            <div class="settings-item">
                <label for="settingVolume">
                    기본 볼륨
                </label>
                <input type="range" id="settingVolume" min="0" max="1" step="0.01" value="0.5">
            </div>

            <div class="settings-item">
                <label for="settingOctave">
                    기본 옥타브
                </label>
                <input type="number" id="settingOctave" min="1" max="7" value="4">
            </div>

            <div class="settings-item">
                <label for="settingBpm">
                    기본 BPM
                </label>
                <input type="number" id="settingBpm" min="40" max="240" value="120">
            </div>

        </section>

    </main>

    <footer class="site-footer">

        <div class="footer-logo">
            🎹 루이의 음악실
        </div>

        <p>
            Louis Kariel Music Blog Project
        </p>

        <p class="copyright">
            © 2026 Louis Kariel. All rights reserved.
        </p>

    </footer>

    <script src="../js/main.js"></script>

</body>

</html>
